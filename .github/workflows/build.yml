name: build-native

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win64, target: x86_64-pc-windows-msvc }
          - { platform: win32, target: i686-pc-windows-msvc }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build win32 (cross from 64-bit Python)
        if: matrix.platform == 'win32'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # abi3 extension-module 不需要链接 libpython；64 位 Python 上编 32 位目标时绕过架构检查
          PYO3_CROSS: 1
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out/${{ matrix.platform }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zcbot_render.dll" "out/${{ matrix.platform }}/zcbot_render.pyd"
      - uses: actions/upload-artifact@v4
        with:
          name: zcbot_render-${{ matrix.platform }}
          path: out/

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,      target: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64,     target: aarch64-unknown-linux-gnu }
          - { platform: linux-armv7,       target: armv7-unknown-linux-gnueabihf }
          - { platform: linux-i686,        target: i686-unknown-linux-gnu }
          - { platform: linux-loongarch64, target: loongarch64-unknown-linux-gnu }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild (cross linker via zig)
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Collect
        run: |
          mkdir -p "out/${{ matrix.platform }}"
          # Linux cdylib 产物带 lib 前缀
          cp "target/${{ matrix.target }}/release/libzcbot_render.so" "out/${{ matrix.platform }}/zcbot_render.so"
      - uses: actions/upload-artifact@v4
        with:
          name: zcbot_render-${{ matrix.platform }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*.pyd
          # so/pyd 一并上传
      - run: |
          cd out
          zip -r ../zcbot_render-native-libs.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: zcbot_render-native-libs.zip
